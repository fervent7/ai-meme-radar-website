name: Review branch security checks

on:
  pull_request:
    branches: [radar-website-research-test]
  push:
    branches: [review/verified-research-terminal]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Scan the checked-out tree for secrets
        run: |
          archive=gitleaks_8.24.3_linux_x64.tar.gz
          curl --fail --silent --show-error --location --max-time 90 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/$archive" \
            --output "$RUNNER_TEMP/$archive"
          (
            cd "$RUNNER_TEMP"
            echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $archive" | sha256sum --check
            tar -xzf "$archive" gitleaks
          )
          "$RUNNER_TEMP/gitleaks" dir . --redact=100 --no-banner
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit npm dependencies and prevent dynamic JavaScript execution
        run: |
          npm audit --audit-level=high
          npx --yes eslint@10.15.0 --no-config-lookup \
            --rule 'no-eval:error' --rule 'no-implied-eval:error' --rule 'no-new-func:error' \
            app.js cached-history.js site.js market-identity.js radar-history.cjs website-test-server.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit browser-test dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          sed -nE 's/^[[:space:]]*python -m pip install (playwright==[0-9.]+)$/\1/p' .github/workflows/website-tests.yml > "$RUNNER_TEMP/browser-requirements.txt"
          test -s "$RUNNER_TEMP/browser-requirements.txt"
          python -m pip_audit -r "$RUNNER_TEMP/browser-requirements.txt" --timeout 10
